[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-thumbnails"
version = "0.1.0"
description = "A lightweight Wagtail StreamField block + DRF serializer that exposes responsive WebP thumbnails with dimensions and focal points."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Profil Software", email = "contact@profil-software.com" }]
keywords = ["wagtail", "django", "djangorestframework", "thumbnails", "webp", "headless", "streamfield"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 5",
    "Framework :: Wagtail :: 6",
    "Framework :: Wagtail :: 7",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "Django>=4.2",
    "Wagtail>=5.2",
    "djangorestframework>=3.14",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/profilsoftware/wagtail-thumbnails"
Repository = "https://github.com/profilsoftware/wagtail-thumbnails"
Issues = "https://github.com/profilsoftware/wagtail-thumbnails/issues"
Changelog = "https://github.com/profilsoftware/wagtail-thumbnails/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "build>=1.2",
    "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wagtail_thumbnails"]

[tool.hatch.build.targets.sdist]
include = ["src/wagtail_thumbnails", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "DJ",               # django
    "PT",               # pytest-style
    "TID",              # tidy-imports
    "TCH",              # type-checking
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM300", "SIM117", "B018"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Wagtail's rendition pipeline leaks SpooledTemporaryFile handles under
    # 3.13's stricter GC. Not our bug - ignore narrowly.
    "ignore::ResourceWarning:tempfile",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Third-party deprecations we can't fix from here. Targeted, not blanket.
    "ignore::DeprecationWarning:django.*",
    "ignore::DeprecationWarning:wagtail.*",
    "ignore::DeprecationWarning:rest_framework.*",
    "ignore::PendingDeprecationWarning:django.*",
    "ignore::PendingDeprecationWarning:wagtail.*",
]

[tool.coverage.run]
source = ["wagtail_thumbnails"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["wagtail.*", "rest_framework.*", "taggit.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
