version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        patterns:
          - "ruff"
          - "mypy*"
          - "pytest*"
          - "django-stubs*"
          - "djangorestframework-stubs*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
