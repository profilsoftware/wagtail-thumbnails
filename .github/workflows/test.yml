name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.1", "5.2"]
        wagtail-version: ["5.2", "6.3", "7.0"]
        exclude:
          - python-version: "3.10"
            django-version: "5.1"
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "4.2"
          - django-version: "4.2"
            wagtail-version: "7.0"
          - django-version: "5.2"
            wagtail-version: "5.2"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install base deps
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }} and Wagtail ${{ matrix.wagtail-version }}
        run: |
          uv pip install \
            "Django~=${{ matrix.django-version }}.0" \
            "Wagtail~=${{ matrix.wagtail-version }}.0"
      - name: Run pytest
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.django-version == '5.1' && matrix.wagtail-version == '6.3'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false
